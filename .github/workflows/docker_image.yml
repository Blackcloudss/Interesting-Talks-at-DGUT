name: Docker Build and Deploy

on:
  push:
    branches: ["test"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      #----------- 构建镜像 -----------
      - name: CheckOut
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write config file
        run: echo "${{ secrets.CONFIG_YAML }}" > config.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: qinsikai
         password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build the Docker image
        run: >  
          docker buildx build .
          --platform linux/amd64
          --push
          --tag qinsikai/interesting-talks:test

      - name: Deploy to Server
        env:
           SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
           SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |  
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$SERVER_IP "    
            docker pull qinsikai/interesting-talks:test;
            if docker ps -aq --filter name=interesting-talks; then
              docker stop interesting-talks || true
              docker rm -f interesting-talks || true
            fi;
            docker run -d\
            --name interesting-talks\
            -p 8085:8080\
            qinsikai/interesting-talks:test
            "