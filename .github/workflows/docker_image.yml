name: Docker Build and Deploy

on:
  push:
    branches: ["test"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      #----------- 构建镜像 -----------
      - name: CheckOut
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write config file
        run: echo "${{ secrets.CONFIG_YAML }}" > config.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: qinsikai
         password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build the Docker image
        run: | 
          docker buildx build . \
          --platform linux/amd64 \
          --push \ 
          --tag qinsikai/interesting-talks:test

      - name: Deploy to Server
        env:
           SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }} # 从 GitHub Secrets 获取 SSH 私钥
           SERVER_IP: ${{ secrets.SERVER_IP }}            # 从 Secrets 获取服务器 IP
        run: |          
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key                  
                    
        # 执行部署命令
            ssh -i ~/.ssh/deploy_key \                    # 指定私钥连接
            -o StrictHostKeyChecking=no \                 # 跳过主机验证
            root@$SERVER_IP "                             # 连接目标服务器
            docker pull qinsikai/interesting-talks:test   # 拉取最新镜像
            if docker ps -aq --filter name=interesting-talks; then # 检查容器是否存在
              docker stop interesting-talks || true      # 停止旧容器
              docker rm -f interesting-talks || true     # 删除旧容器
            fi
            docker run -d \                               # 后台运行新容器
            --name interesting-talks \                    # 容器命名
            -p 8085:8080 \                                # 端口映射
            qinsikai/interesting-talks:test               # 使用最新镜像
            "